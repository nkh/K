<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="favicon-128x128.png">
    <link rel="apple-touch-icon" sizes="128x128" href="favicon-128x128.png">
    <link rel="stylesheet" href="style.css">
    <title>vrunner Admin</title>
</head>
<body>
<div class="app">
    <!-- Top bar -->
    <div class="topbar">
        <h1>vrunner</h1>
        <div class="topbar-group topbar-group-left">
            <button class="btn btn-xs" onclick="toggleSidebar()" title="Toggle sidebar">&#9776;</button>
            <button class="btn btn-xs" onclick="addPanel()" title="Add panel">+ Panel</button>
            <button id="pauseRunBtn" class="btn btn-xs" onclick="togglePauseRun()" title="Pause/Resume">&#9208; Pause</button>
        </div>
        <div class="topbar-group topbar-group-center">
            <div class="font-size-ctrl">
                <button class="btn btn-xs" onclick="changeFontSize(-1)" title="Decrease font size">A-</button>
                <span id="fontSizeLabel">10px</span>
                <button class="btn btn-xs" onclick="changeFontSize(1)" title="Increase font size">A+</button>
            </div>
            <div class="resize-controls">
                <label>R:</label>
                <input type="number" id="resizeRows" value="24" min="1" max="200" title="Terminal rows">
                <label>C:</label>
                <input type="number" id="resizeCols" value="80" min="1" max="500" title="Terminal columns">
                <button class="btn btn-xs" onclick="resizeTerminal()">Resize</button>
            </div>
            <select id="bufferSelect" class="select-xs" onchange="switchBuffer(this.value)" title="Which terminal buffer to view">
                <option value="current">Current</option>
                <option value="main">Main Buffer</option>
                <option value="alt">Alt Buffer</option>
            </select>
            <span id="altScreenBadge" class="alt-screen-badge">ALT SCREEN</span>
        </div>
        <div class="topbar-group topbar-group-right">
            <button class="btn btn-xs" id="logsBtn" onclick="toggleLogsView()" title="Toggle log viewer">Logs</button>
            <button class="btn btn-xs" id="statusBtn" onclick="toggleBottombar()" title="Toggle status bar">Status</button>
            <div class="token-bar">
                <label for="authToken">Token:</label>
                <input type="password" id="authToken" placeholder="Bearer token" title="Authorization token">
                <button class="btn btn-xs" onclick="saveToken()">Set</button>
            </div>
            <button class="btn btn-xs" onclick="showDocs()" title="Documentation">Docs</button>
            <button class="btn btn-xs" onclick="showShortcuts()" title="Keyboard shortcuts">?</button>
            <button class="btn btn-xs" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">☾</button>
        </div>
    </div>

    <div class="main">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <div class="sidebar-tab active" onclick="switchSidebarTab('commands', this)">Commands</div>
                <div class="sidebar-tab" onclick="switchSidebarTab('spawn', this)">Spawn</div>
                <div class="sidebar-tab" onclick="switchSidebarTab('certs', this)">Certs</div>
            </div>
            <div class="sidebar-content" id="sidebarContent">
                <!-- Commands tab (default) -->
                <div id="tab-commands">
                    <div style="padding:0.2rem 0.3rem;display:flex;gap:0.2rem;align-items:center;">
                        <input type="text" id="cmdFilter" placeholder="Filter..." oninput="loadCommands()" style="flex:1;min-width:0;font-size:0.65rem;padding:0.1rem 0.3rem;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:2px;">
                        <button class="btn btn-xs btn-danger" onclick="killAllCommands()" title="Kill all running commands">Kill All</button>
                    </div>
                    <div id="commandList"></div>
                </div>
                <!-- Spawn tab -->
                <div id="tab-spawn" style="display:none;">
                    <div class="spawn-form">
                        <div class="field">
                            <label>Command</label>
                            <input type="text" id="spawnCmd" placeholder="/usr/bin/htop" onkeydown="if(event.key==='Enter'){event.preventDefault();spawnCommand()}">
                        </div>
                        <div class="field">
                            <label>Arguments (space-separated)</label>
                            <input type="text" id="spawnArgs" placeholder="-- arg1 arg2" onkeydown="if(event.key==='Enter'){event.preventDefault();spawnCommand()}">
                        </div>
                        <div class="autofit-row">
                            <div class="field">
                                <label>Rows</label>
                                <input type="number" id="spawnRows" value="" min="1" max="200" placeholder="default">
                            </div>
                            <div class="field">
                                <label>Cols</label>
                                <input type="number" id="spawnCols" value="" min="1" max="500" placeholder="default">
                            </div>
                            <button class="btn btn-xs" onclick="autofitTerminalSize()" title="Calculate optimal terminal size from the panel container" style="align-self:flex-end;margin-bottom:0.2rem;">Auto-fit</button>
                        </div>
                        <div class="autofit-hint" id="autofitHint"></div>
                        <div class="field">
                            <label>Certificate (optional)</label>
                            <select id="spawnCert">
                                <option value="">None</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Target Instance</label>
                            <select id="spawnInstance"></select>
                        </div>
                        <button class="btn btn-primary" onclick="spawnCommand()" style="width:100%;margin-top:0.5rem;">Spawn Command</button>
                    </div>
                </div>
                <!-- Certs tab -->
                <div id="tab-certs" style="display:none;">
                    <div id="certList"></div>
                </div>
            </div>
        </div>
        <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>

        <!-- Content area -->
        <div class="content-area" id="contentArea">
            <!-- Terminal view -->
            <div id="view-vtty" class="panel-container">
                <!-- Panels are dynamically added here -->
            </div>

            <!-- Log view -->
            <div id="view-log" class="log-viewer" style="display:none;">
                <div class="log-toolbar">
                    <input type="text" id="logSearch" placeholder="Search logs..." oninput="searchLogs()">
                    <button class="btn btn-xs" onclick="clearLogSearch()">Clear</button>
                    <button class="btn btn-xs" onclick="loadLog()">Refresh</button>
                    <span id="logTransportIndicator" class="log-transport-indicator" data-mode="http">HTTP</span>
                    <span id="logCount" style="font-size:0.7rem;color:var(--text-muted);"></span>
                </div>
                <div class="log-content" id="logContent"></div>
            </div>

            <!-- Docs view -->
            <div id="view-docs" class="docs-page" style="display:none;"></div>
        </div>
    </div>

    <!-- Bottom bar (hidden by default) -->
    <div class="bottombar hidden" id="bottomBar">
        <span class="cmd-label" id="cmdLabel"></span>
        <span class="cursor-pos" id="cursorPos">Cursor: --</span>
        <span class="dims" id="termDims">--</span>
        <span class="cursor-pos" id="scrollbackIndicator" style="color:var(--yellow);display:none;">SCROLLBACK</span>
        <span class="spacer"></span>
        <label for="updateMode" style="font-size:0.6rem;color:var(--text-muted);">Update:</label>
        <select id="updateMode" onchange="switchUpdateMode(this.value)" title="How the web UI detects VTTY buffer changes" style="font-size:0.6rem;padding:0.05rem 0.15rem;background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border);border-radius:2px;">
            <option value="push">Push (WS)</option>
            <option value="poll">Poll</option>
        </select>
        <span id="pollIntervalWrap" style="display:none;">
            <input type="number" id="pollInterval" value="500" min="50" max="5000" step="50" style="width:50px;font-size:0.65rem;text-align:center;padding:0.1rem 0.15rem;" title="Poll interval in milliseconds" onchange="applyPollInterval()">
            <span style="font-size:0.65rem;color:var(--text-muted);">ms</span>
        </span>
        <span id="wsQuality" class="ws-quality" title="">--</span>
        <span style="font-size:0.6rem;color:var(--text-muted);" id="connStatus">Connected</span>
    </div>
</div>

<!-- Add panel modal -->
<div class="modal-overlay" id="panelModal" style="display:none;" onclick="if(event.target===this)closePanelModal()">
    <div class="modal">
        <h2>Add Instance Panel</h2>
        <div class="field">
            <label>Instance URL</label>
            <input type="text" id="panelUrl" placeholder="http://localhost:9090">
        </div>
        <div class="field">
            <label>Label (optional)</label>
            <input type="text" id="panelLabel" placeholder="Instance 2">
        </div>
        <div class="field">
            <label>Auth Token (optional)</label>
            <input type="text" id="panelToken" placeholder="Bearer token for this instance">
        </div>
        <div class="actions">
            <button class="btn" onclick="closePanelModal()">Cancel</button>
            <button class="btn btn-primary" onclick="confirmAddPanel()">Add Panel</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>

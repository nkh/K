[book]
title = "vrunner Web UI"
authors = ["vrunner contributors"]
language = "en"
multilingual = false
src = "."

[build]
build-dir = "book"

[output.html]
default-theme = "dark"
preferred-dark-theme = "dark"
git-repository-url = "https://github.com/nkh/K"
edit-url-template = "https://github.com/nkh/K/edit/main/docs/web-ui/{path}"

[output.html.print]
enable = true

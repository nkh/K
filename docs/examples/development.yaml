# vrunner — Development Configuration
# Optimized for local development with multiple services

server:
  bind: "127.0.0.1"
  port: 9090

vtty:
  rows: 40
  cols: 120
  term: "xterm-256color"
  scrollback: 10000
  truecolor: true

# Show interactive display with tabs for all spawned commands
display:
  enabled: true
  refresh_ms: 50

# Tab bar and keybindings for the interactive display
interactive:
  tabs: true
  keybindings:
    next_command: "ctrl+right"
    prev_command: "ctrl+left"
    toggle_log: "ctrl+l"
    spawn_command: "f12"
    show_help: "ctrl+h"
    quit: "ctrl+\\"

# Default environment variables for all spawned commands
environment:
  variables:
    RUST_LOG: "debug"
    RUST_BACKTRACE: "1"

# Pre-defined output handles
handles:
  - name: "stdout"
    type: "file"
    path: "/tmp/vrunner-stdout.log"

# Named profiles for different workflows
profiles:
  frontend:
    environment:
      variables:
        NODE_ENV: "development"
    vtty:
      rows: 30

  backend:
    environment:
      variables:
        DATABASE_URL: "postgres://localhost/myapp_dev"
    display:
      enabled: true

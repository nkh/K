[package]
name = "vrunner"
version = "0.1.0"
edition = "2021"
authors = ["nkh"]
description = "A virtual terminal runner with web control plane"
license = "GPL-3.0-or-later OR Artistic-2.0"
repository = "https://github.com/nkh/K"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
config = "0.14"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
crossterm = "0.27"
libc = "0.2"
dirs = "5"
sysinfo = "0.29"
async-trait = "0.1"
rust-embed = { version = "8", features = ["axum", "mime-guess"] }
dashmap = "5"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
unicode-width = "0.2.2"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
urlencoding = "2"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

[package]
name = "vrunner"
version = "0.1.0"
edition = "2021"
authors = ["nkh"]
description = "A virtual terminal runner"
license = "GPL-3.0-or-later OR Artistic-2.0"
repository = "https://github.com/nkh/K"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
config = "0.14"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
portable-pty = "0.8"
crossterm = "0.27"
libc = "0.2"
dirs = "5"
async-trait = "0.1"
dashmap = "5"
parking_lot = "0.12"
unicode-width = "0.2.2"
regex = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
strip = "symbols"
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

# ═══════════════════════════════════════════════════════════════════════════
# vrw — Full Example Configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# This file documents ALL configuration options with their defaults and
# descriptions.  Copy it to vrw.yaml (or vrw.toml) in your project
# root or ~/.config/vrw/config.yaml to customize vrw.
#
# Config file locations (searched in order, later overrides earlier):
#   1. ~/.config/vrw/config.yaml   (or .toml)
#   2. ./vrw.yaml                   (or .toml) in the working directory
#   3. Path specified with --config CLI flag
#
# Precedence (highest wins):
#   CLI flags > local config > global config > built-in defaults
#
# All fields are optional — vrw ships with sensible defaults.
# ═══════════════════════════════════════════════════════════════════════════

# ─── Server ───────────────────────────────────────────────────────────
# HTTP server bind address and port.
server:
  # Bind address. "127.0.0.1" = localhost only (safe default).
  # Set to "0.0.0.0" to accept connections from any interface.
  # WARNING: When binding to 0.0.0.0, always enable authentication
  # or use TLS.  Without auth, anyone on the network can spawn
  # commands, send keystrokes, and kill your processes.
  bind: "127.0.0.1"
  # TCP port to listen on.
  port: 9090


# ─── Security ─────────────────────────────────────────────────────────
# Authentication and authorization settings.
security:
  # Require bearer token authentication for all API and WebSocket requests.
  # When enabled, every request must include an Authorization header:
  #   Authorization: Bearer <token>
  # The token is loaded from token_file below.  If the file does not
  # exist, a random 256-bit token is generated and saved automatically.
  #
  # This is automatically set to true when --remote is used (0.0.0.0 bind).
  require_auth: false
  # Path to the bearer token file.
  # If require_auth is true and this file does not exist, vrw
  # generates a secure random token and writes it to this path.
  # The token is printed to stdout on first generation.
  token_file: "~/.config/vrw/token"


# ─── TLS / HTTPS ──────────────────────────────────────────────────────
# When enabled, vrw serves HTTPS instead of HTTP.
# Self-signed certificates are auto-generated on first use.
tls:
  # Enable TLS encryption. Default: false.
  enabled: false
  # Custom PEM-encoded certificate file path.
  # If not set, defaults to ~/.config/vrw/cert.pem (auto-generated).
  # cert_file: "/path/to/cert.pem"
  # Custom PEM-encoded private key file path.
  # If not set, defaults to ~/.config/vrw/key.pem (auto-generated).
  # key_file: "/path/to/key.pem"


# ─── Certificates ─────────────────────────────────────────────────────
# Per-command client certificate pool for fine-grained access control.
#
# When a command is spawned with a certificate binding, only clients
# presenting that certificate (or its derived bearer token) can
# interact with the command — send keys, view terminal output, etc.
#
# Certificates are useful in multi-user environments where different
# teams need access to different commands without sharing a single
# admin token.
certificates:
  # Base directory where generated certificate files are stored.
  # Paths in entries below are resolved relative to this directory
  # if they are not absolute.
  # directory: "~/.config/vrw/certs"
  # Named certificate definitions.  Each entry needs a name, cert_file,
  # and key_file.  Missing files are auto-generated on first use.
  #
  # entries:
  #   - name: "webapp-frontend"
  #     cert_file: "webapp-frontend/cert.pem"
  #     key_file: "webapp-frontend/key.pem"
  #   - name: "backend-api"
  #     cert_file: "backend-api/cert.pem"
  #     key_file: "backend-api/key.pem"


# ─── Virtual Terminal (VTTY) ─────────────────────────────────────────
# Controls the dimensions and capabilities of the pseudo-terminal (PTY)
# allocated for each spawned command.  These settings affect what the
# child process sees when it queries its terminal size ($LINES, $COLUMNS,
# ioctl TIOCGWINSZ).
vtty:
  # Number of rows (lines) in the virtual terminal.
  # Default: 24 (standard 80x24 terminal).
  rows: 24
  # Number of columns in the virtual terminal.
  # Default: 80 (standard 80x24 terminal).
  cols: 80
  # The TERM value reported to child processes via the TERM environment
  # variable.  This tells programs like vim, htop, and tmux what terminal
  # capabilities are available.
  #
  # Common values:
  #   "xterm-256color"  — most compatible, supports 256 colors (default)
  #   "xterm-truecolor" — enables 24-bit RGB color support
  #   "screen"          — minimal, for screen/tmux compatibility
  #   "dumb"            — no capabilities at all
  term: "xterm-256color"
  # Maximum number of scrollback lines retained per command.
  # The scrollback buffer stores output that has scrolled off the top
  # of the visible terminal area.  Higher values use more memory.
  # Default: 5000 lines (~2.5 MB per command at 80 columns).
  scrollback: 5000
  # Enable 24-bit truecolor (RGB) support in the terminal emulator.
  # When enabled, programs that detect COLORTERM=truecolor can use
  # the full 16.7 million color palette.
  # Default: true.
  truecolor: true
  # Enable mouse event forwarding to child processes.
  # When enabled, mouse clicks, scrolls, and movements in the web UI
  # and local display are forwarded as escape sequences to the child.
  # Some programs (htop, vim) interpret these for interactive use.
  # Default: false.
  mouse: false


# ─── Display ─────────────────────────────────────────────────────────
# Local terminal display of VTTY output.
# When enabled, vrw renders the active command's terminal output
# directly in the terminal it was launched from (similar to mprocs).
display:
  # Show VTTY output on the local terminal screen.
  # When enabled, the terminal enters alternate screen mode (like vim)
  # and renders the command's output there.  Keystrokes are forwarded
  # to the active command.
  # Default: false (headless mode — use the web UI instead).
  enabled: false
  # Keep displaying after the initial CLI command exits (monitor mode).
  # When false (default), the display is dismissed when the command
  # exits and a status message is printed.  The server keeps running
  # to serve the web UI and handle API requests.
  # When true, the display stays active and you can switch between
  # running commands using keybindings.
  display_all: false
  # Refresh interval in milliseconds when display is enabled.
  # Lower values give smoother updates but use more CPU.
  # Default: 100 ms (10 FPS).
  refresh_ms: 100


# ─── Interactive ─────────────────────────────────────────────────────
# Interactive terminal display settings.  These only apply when running
# vrw with a command (e.g., `vrw --display htop`) or when
# display.enabled is true.
interactive:
  # Show a tab bar at the top of the display listing all running commands.
  # When false, the active command name is shown in the status bar only.
  tabs: false
  # Configurable keybindings for the interactive terminal display.
  # Each keybinding maps a human-readable key name to an action.
  # When a key sequence matches, the action is executed instead of
  # forwarding the keystroke to the active command.
  #
  # Key name format (human-readable, preferred):
  #   Ctrl+Left     = "ctrl+left"
  #   Ctrl+Right    = "ctrl+right"
  #   Ctrl+L        = "ctrl+l"
  #   Ctrl+H        = "ctrl+h"
  #   Ctrl+K        = "ctrl+k"
  #   F12           = "f12"
  #   Enter         = "enter"
  #   Esc           = "esc"
  #   Tab           = "tab"
  #   Backspace     = "backspace"
  #   Delete        = "delete"
  #   Home          = "home"
  #   End           = "end"
  #   PageUp        = "pageup"
  #   PageDown      = "pagedown"
  #   Up/Down/Left/Right = "up", "down", "left", "right"
  #   Alt+X         = "alt+x"    (any character)
  #   Shift+Tab     = "shift+tab"
  #   Shift+Left    = "shift+left"
  #   Ctrl+@        = "ctrl+@"
  #
  # Raw escape sequences also work (for backward compatibility):
  #   Ctrl+Right = "\x1b[1;5C"
  #   Ctrl+Left  = "\x1b[1;5D"
  #
  # Available actions:
  #   next_command     — switch to the next running command (wraps around)
  #   prev_command     — switch to the previous running command (wraps around)
  #   toggle_log       — show/hide the command event log overlay
  #   spawn_command    — open a prompt to spawn a new command
  #   show_help        — show the keybinding help overlay (Ctrl+H)
  #   kill_command     — kill (SIGTERM) the active command
  #   toggle_pause     — pause/resume (SIGSTOP/SIGCONT) the active command
  #   quit             — exit the display loop
  #
  # Note: Ctrl+\ always quits the display regardless of keybindings.
  keybindings:
    next_command: "ctrl+right"      # Switch to next command
    prev_command: "ctrl+left"       # Switch to previous command
    toggle_log: "ctrl+l"           # Toggle command log overlay
    spawn_command: "f12"            # Open spawn prompt
    show_help: "ctrl+h"             # Show help overlay
    # kill_command: "ctrl+k"       # Kill active command (uncomment to enable)
    # toggle_pause: "ctrl+z"       # Pause/resume active command (uncomment to enable)
    # quit: "esc"                   # Quit display (Ctrl+\ always works)


# ─── Command Log ─────────────────────────────────────────────────────
# Records API command events (spawn, kill, send_keys, resize, etc.)
# for auditing and debugging purposes.
command_log:
  # Enable logging of API commands to the in-memory buffer.
  # The in-memory buffer is always available (2048 entries) and can
  # be viewed via the web UI Logs tab or the /api/log endpoint.
  enabled: false
  # Path to a log file.  If set, all command events are also appended
  # to this file in addition to the in-memory buffer.
  # The log format is: [RFC3339 timestamp] command_type: details
  # file: "./vrw.log"
  # Path to a file where raw PTY output from child processes is logged.
  # Each line records one read() call from the PTY master fd, formatted as:
  #   <elapsed_ms> <escaped_bytes>
  # Printable ASCII (0x20-0x7E) is written as-is; non-printable bytes
  # and escape sequences use \xHH hex notation.  Backslash is escaped
  # as \\.
  #
  # This produces a human-readable yet machine-parseable log that can
  # be replayed step-by-step with the tools/ansi-replay utility:
  #   perl tools/ansi-replay /tmp/pty-output.log    # interactive
  #   perl tools/ansi-replay /tmp/pty-output.log --dump  # all at once
  #
  # Can also be set via CLI:  vrw --log-pty-raw /tmp/pty-output.log -- cmd
  # pty_raw_log: "/tmp/pty-output.log"


# ─── Default Exit Configuration ──────────────────────────────────────
# Default exit behavior applied to every command unless overridden
# per-command via the spawn API, CLI, or per-command config.
#
# These hooks run on the vrw host (not inside the child's PTY)
# after the child process exits.  They are useful for notifications,
# cleanup tasks, or triggering follow-up actions.
default_exit:
  exit:
    # Command to run when the child exits cleanly (exit code 0).
    # The string is split on whitespace into a binary and arguments.
    # Example: "notify-send Build OK"
    # Set to null or omit to disable.
    # on_exit: "notify-send 'Command finished'"
    # Command to run when the child exits with a non-zero code.
    # Example: "notify-send Build FAILED"
    # Set to null or omit to disable.
    # on_error: "notify-send 'Command failed'"
    # Maximum seconds to wait for the child to exit after SIGTERM
    # before sending SIGKILL.  Applies when kill is called or when
    # the server shuts down gracefully.
    # Default: 10 seconds.
    timeout_secs: 10


# ─── Daemon ──────────────────────────────────────────────────────────
# Background process (daemon) mode.  When enabled, vrw forks into
# the background after binding the port.  Only available on Unix systems.
daemon:
  # Run as a background daemon.
  # Can also be enabled with the --daemon CLI flag.
  enabled: false
  # File to redirect stdout to when daemonized.
  stdout_file: "/tmp/vrw.out"
  # File to redirect stderr to when daemonized.
  stderr_file: "/tmp/vrw.err"


# ─── Environment Variables ───────────────────────────────────────────
# Environment variables applied to every spawned command by default.
#
# These are merged with per-command env vars (from the API's "env"
# field or CLI --env flags).  Per-command variables override config
# variables with the same name.
#
# Set no_env: true on a per-command basis (API) or use --no-env (CLI)
# to skip ALL config-level environment variables for a specific command.
#
# Note: vrw always sets TERM, COLORTERM, and VRW_CMD_ID in the
# child's environment regardless of this setting.
environment:
  variables:
    # RUST_LOG: "info"
    # DATABASE_URL: "postgres://localhost/mydb"
    # MY_APP_ENV: "production"


# ─── Web Admin Panel ────────────────────────────────────────────────
# Configuration for the built-in web admin panel at /admin.
# Controls how the web UI detects terminal buffer changes.
web:
  # How the web UI discovers that a terminal buffer has changed.
  #
  # "push" (default): The server monitors each command's VTTY buffer
  #   at a configurable interval and sends lightweight "vtty_dirty"
  #   WebSocket signals when changes are detected.  The web client
  #   then fetches the updated HTML at its own pace.  This is the most
  #   efficient mode — no polling is required.
  #
  # "poll": The web client periodically calls
  #   GET /api/commands/:id/vtty/changed to check for changes.
  #   Useful when WebSocket connections are unreliable (e.g., behind
  #   a reverse proxy that buffers WebSocket frames).
  update_mode: "push"
  # Server-side dirty-check interval in milliseconds (push mode only).
  # Controls how often the server compares the VTTY buffer against
  # the last-sent snapshot.  Lower = faster updates but more CPU.
  # Default: 200 ms.
  dirty_check_ms: 200
  # Default client-side polling interval in milliseconds (poll mode only).
  # The user can override this via the web UI controls.
  # Default: 500 ms.
  default_poll_ms: 500


# ─── Output Handles ──────────────────────────────────────────────────
# Pre-configured output handles for spawned commands.
# Handles route command output to files, other VTTYs, or a null sink.
#
# Each handle has a name (used as an identifier in the API) and a sink
# type.  When a command is spawned with a handle attached, its output
# is tee'd to the handle's sink in addition to the primary VTTY.
#
# Sink types:
#   "file"  — write output to a file.  Path supports {id} (command UUID)
#            and {name} (command name) placeholders.
#   "vtty"  — mirror to another VTTY buffer (for split-view in web UI).
#   "null"  — discard output (useful for suppressing noisy commands).
#
# Example:
# handles:
#   - name: "debug-log"
#     sink: "file"
#     path: "./logs/debug-{name}-{id}.log"
#   - name: "mirror"
#     sink: "vtty"


# ─── Profiles ────────────────────────────────────────────────────────
# Named configuration presets.  Each profile is a partial config that
# overrides specific fields of the base config when selected.
#
# Profiles are selected via:
#   --profile NAME  (CLI flag)
#   "profile": "NAME"  (API spawn body field)
#
# Only fields present in a profile override the base config.
# CLI flags always have the highest precedence.
#
# Example:
# profiles:
#   entries:
#     production:
#       server:
#         bind: "0.0.0.0"
#       security:
#         require_auth: true
#       environment:
#         variables:
#           RUST_LOG: "warn"
#     development:
#       vtty:
#         rows: 40
#         cols: 120
#       display:
#         enabled: true
#       environment:
#         variables:
#           RUST_LOG: "debug"

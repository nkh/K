# vrw configuration file (TOML)
# Place this as vrw.toml in your project root
#
# Precedence (highest wins):
#   CLI flags > ./vrw.toml (or .yaml) > ~/.config/vrw/config.toml (or .yaml) > defaults

[server]
# Bind address. "127.0.0.1" = localhost only (safe default).
# "0.0.0.0" = listen on all interfaces (use with --auth).
bind = "127.0.0.1"
# TCP port to listen on.
port = 9090

[security]
# Require bearer token authentication for all API requests.
# Automatically enabled by --remote (0.0.0.0 bind).
require_auth = false
# Path to the bearer token file.
token_file = "~/.config/vrw/token"

[tls]
# Enable HTTPS with TLS encryption.
# On first use, self-signed certificates are auto-generated.
enabled = false
# Custom certificate file path (optional).
cert_file = "~/.config/vrw/cert.pem"
# Custom private key file path (optional).
key_file = "~/.config/vrw/key.pem"

[certificates]
# Base directory for generated certificate files.
directory = "~/.config/vrw/certs"
# Pre-defined certificate entries (empty by default).
# Each entry has a name, cert_file, and key_file.
# entries = [
#     { name = "my-app", cert_file = "my-app/cert.pem", key_file = "my-app/key.pem" },
# ]

[vtty]
rows = 24
cols = 80
term = "xterm-256color"
scrollback = 5000
truecolor = true
mouse = false
# Default font size for PNG screenshot rendering (points).
screenshot_font_size = 12
# Default font name/path for PNG screenshots.
# "monospace" = search system paths. Set to a path for a specific font.
screenshot_font_name = "monospace"

[display]
enabled = false
display_all = false
refresh_ms = 100

[command_log]
enabled = false
# file = "./vrw.log"

[daemon]
enabled = false
stdout_file = "/tmp/vrw.out"
stderr_file = "/tmp/vrw.err"

# Default handles attached to every spawned command.
# handles = [
#     { name = "debug", sink = "file", path = "./logs/debug-{id}.log" },
#     { name = "aux", sink = "vtty" },
# ]
